name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        run: |
          xcodebuild \
            -project SimulatorPorvanogoTuzaKosti.xcodeproj \
            -scheme SimulatorPorvanogoTuzaKosti \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/SimulatorPorvanogoTuzaKosti.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -r SimulatorPorvanogoTuzaKosti-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SimulatorPorvanogoTuzaKosti-unsigned-IPA
          path: SimulatorPorvanogoTuzaKosti-unsigned.ipa
          if-no-files-found: error
